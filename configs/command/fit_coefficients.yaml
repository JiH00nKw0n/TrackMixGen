# @package _global_
# tmg fit_coefficients: fit the per-subtask success model of the logistic mixer on a finished uniform-source baseline
# pool (method=none, selection=ours) and write configs/experiment/generator/<generator>/coefficients/<task>.yaml.
#   tmg fit_coefficients task=hammer_cleanup scene=ours selection=ours generation=rank_human_demos
defaults:
  - /paths: local
  - /cluster: local
  - /generator: mimicgen
  - /task: ???
  - /scene: ours
  - /selection: ours
  - /generation: rank_human_demos
  - _self_

# The baseline pool to read (the output folder of `tmg generate` with method=none and the same choices).
pool: ${paths.pools}/${generator.name}/${task.name}/${scene.name}/${selection.name}/none/${generation.name}
output: ${paths.reports}/fit_coefficients/${generator.name}/${task.name}/${scene.name}/${selection.name}/${generation.name}
command: fit_coefficients
source: ${task.source}           # source demonstrations with datagen_info (each source's in-hand pose)
overrides: []
write_config: true                # also write configs/experiment/generator/<generator>/coefficients/<task>.yaml
min_attempts: 100                 # refuse to fit on fewer attempts
