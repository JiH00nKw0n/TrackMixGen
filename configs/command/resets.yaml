# @package _global_
# tmg resets: draw and store the fixed evaluation scenes of (task, scene) once (simulator image).
#   tmg resets task=square scene=ours
defaults:
  - /paths: local
  - /cluster: local
  - /generator: mimicgen
  - /task: ???
  - /scene: ours
  - /evaluation: default
  - _self_
command: resets
overrides: []
robot: Panda
dataset: null                     # common hdf5 whose env_args rebuild the generation environment (CP-Gen: robosuite 1.5,
                                  # absolute actions); null = the MimicGen-style environment of the registered scene class
overwrite: false
