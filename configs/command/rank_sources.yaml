# @package _global_
# tmg rank_sources: order the source demonstrations of one task by their generation success in a finished
# baseline pool (method=none) and write configs/experiment/generator/<generator>/ranking/<task>.yaml.
#   tmg rank_sources task=hammer_cleanup scene=ours generation=rank_human_demos
defaults:
  - /paths: local
  - /cluster: local
  - /generator: mimicgen
  - /task: ???
  - /scene: ours
  - /generation: rank_human_demos
  - _self_

# The baseline pool to read (the output folder of `tmg generate` with method=none and the same choices).
pool: ${paths.pools}/${generator.name}/${task.name}/${scene.name}/none/${generation.name}
output: ${paths.reports}/rank_sources/${generator.name}/${task.name}/${scene.name}/${generation.name}
command: rank_sources
overrides: []
write_config: true                # also write configs/experiment/generator/<generator>/ranking/<task>.yaml (the committed ranking)
min_attempts: 100                 # refuse to rank from fewer attempts
