# Isaac PRO 6000 server (ssh isaac): docker available to the user, data under the lab workspace.
name: isaac
runtime: docker
image: tmg/robosuite:latest
sif: null
data_root: /home/gpuadmin/workspace/jihoonkwon/tmg_data
workers: auto
max_workers: 16
shared_gpus: true             # other users hold GPUs here: a simulator that takes one GPU must be told which (the generator's gpu_variable, ISAAC_GPU)
hostname: gpusystem           # `hostname -s` of this machine: the Makefile applies shared_gpus here also when CLUSTER was left at its default
# max_workers_by_simulator: {isaaclab: N}   # only to override a generator's default_max_workers (Isaac Lab: 3) on this machine
threads_per_worker: 1
min_free_disk_gib: 20
render: egl                     # offscreen rendering of the robosuite images: EGL only (GPU, NVIDIA EGL; EGL device i = GPU i here)
