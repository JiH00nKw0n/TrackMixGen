# Isaac PRO 6000 server (ssh isaac): docker available to the user, data under the lab workspace.
name: isaac
runtime: docker
image: tmg/robosuite:latest
sif: null
data_root: /home/gpuadmin/workspace/jihoonkwon/tmg_data
