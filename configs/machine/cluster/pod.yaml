# Native Python environments inside an existing GPU Pod. TMG_DATA_ROOT selects the writable data folder.
name: pod
runtime: native
image: tmg/isaaclab-soft:latest
sif: null
data_root: null
workers: 3                  # three chunk candidates; Pod memory admission may allow fewer
max_workers: 3
threads_per_worker: 2
min_free_disk_gib: 50
device: cuda:0
