# Training budget and bookkeeping shared by the policies (2026-10-24 decisions). Batch sizes and update counts
# per policy and observation are in `by_policy`; the loop picks the block of the chosen policy and observation
# (image: the paper setting; low_dim: the official low-dim batch sizes, robomimic 100 and Diffusion Policy 256).
name: default
by_policy:
  bc_rnn:
    image:   {batch_size: 16, updates: 100000}
    low_dim: {batch_size: 100, updates: 100000}
  diffusion_policy:
    image:   {batch_size: 64, updates: 100000}
    low_dim: {batch_size: 256, updates: 100000}
  pi0:
    image:   {batch_size: 32, updates: 30000}   # validation off for π0 (last checkpoint, openpi recipe)
updates_per_epoch: 500            # one logging epoch
checkpoint_every_epochs: 20       # write a checkpoint (and request validation) every 10,000 updates
keep_checkpoints: all             # all | last (the selection needs all of them)
grad_clip_norm: 1000.0            # L2 gradient-norm clip (BC-RNN pre-noise labels diverged without it)
action_key: actions               # dataset key the policy learns: actions (the pool's label) | actions_executed | actions_pre_noise
cache: ram                        # ram | gpu: where the uint8 images live during training
seed: 1
num_threads: 8
amp: false
validation:
  enabled: true
  scenes: 25                      # fixed validation scenes evaluated at every checkpoint
  command: null                   # host command template run after each checkpoint, e.g. "make validate RUN={run_dir} CKPT={checkpoint}";
                                  # null = checkpoints are validated afterwards by `make validate`
selection: best_validation        # best_validation (highest success, earliest on ties) | last
