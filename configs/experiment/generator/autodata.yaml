# NVIDIA AutoData (isaac-sim/AutoData @ 835f4aab): the DexMimicGen rewrite that runs the Isaac Lab-Arena GR1 tasks of the
# paper plan, Microwave Opening and Bottle Placement and Door Closing (Arena @ 481f5ae5, Isaac Lab 3.0 @ 28a386f0, Isaac
# Sim 6.1). Image tmg/isaaclab-autodata (docker/isaaclab-autodata.Dockerfile).
name: autodata
simulator: isaaclab
image: tmg/isaaclab-autodata
package: autodata_core                     # DataGenerator, MultiWaypoint (a rewrite, not isaaclab_mimic)
commit: 835f4aab0fff759a789586454d939f12a9a40997
arena_commit: 481f5ae5f19df7bc5d24a17240fc0d96ac81eaf7
isaaclab_commit: 28a386f063e41c04c07f50e63eefb83fd8408fbe
source_root: ${oc.env:TMG_AUTODATA_SRC,/opt/src/AutoData}
script: scripts/generate_dataset.py
embodiment: autodata_examples/embodiments/gr1_ik_abs.yaml      # GR1 whole-body IK, absolute poses, 36-D action
external_callback: isaaclab_arena.environments.isaaclab_interop.environment_registration_callback
kit_args: null
extra_args: []
# Source text hashes of the grafted functions (sha256 of inspect.getsource); null = not pinned yet, the first chunk
# run prints the installed hashes under "hashes". Pin them afterwards so a changed package refuses to run.
graft_hashes: {generate: null, trajectory: null, execute: null}
# action: [left pos 3, left quat 4, right pos 3, right quat 4, left hand 11, right hand 11] (gr1_ik_abs.yaml)
eefs: [left, right]
arm_action_dims: {left: [0, 7], right: [7, 14]}
hand_prefixes: null                        # hand joints are not split for the baseline (no mixing/tracking yet)
hand_term: null
measure_links: null                        # the follower error is not measured here (method none only)
noise_draw_shapes: []
method_overrides: {}
