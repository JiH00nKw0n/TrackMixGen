# CP-Gen (kevin-thankyou-lin/cpgen @ 1e7c1fc4, cpgen-envs @ c4eea73e) on robosuite f687ae7c / MuJoCo 3.2.6 with
# cuRobo v0.7.8 motion planning (GPU). Constraint-preserving generation: each attempt re-solves the annotated
# keypoint constraints of one source demonstration for the new object poses and motion-plans between them.
name: cpgen
simulator: robosuite
image: tmg/cpgen
package: demo_aug
commit: 1e7c1fc4a467c7678c8542ca762e332d1757d8d5
source_repo: cpgen/datasets-src        # Hugging Face dataset repo of the source demonstrations and annotations
source_root: ${oc.env:TMG_CPGEN_SRC,/opt/src/cpgen}   # checkout: working directory of the chunk (relative config paths)
# Source text hashes (sha256 of inspect.getsource) of the grafted functions at the pinned commit: DemoGenerator.generate_demo
# (every method) and CPPolicy.solve_constraint (methods with source mixing only). tests/unit/fixtures/cpgen_generate_demo.py
# and tests/unit/fixtures/cpgen_solve_constraint.py hold those texts; a changed package refuses to run.
graft_hashes:
  generate_demo: a497e9da6ef4f84624c9646fd49ee55fae1dedaa93e428c90f8fa312972b40e2
  solve_constraint: efb3f236ae9e51ae2e38f98819ff2f0f5d40b5bdeda75c43df7bb6d984582711
# demo_aug.generate.Config fields applied to every task (after the task's). The authors' launcher
# (scripts/pipeline/run_datagen_and_training.sh) sets the robot start-pose noise to Gaussian 0.06; the Config default is 0.02.
# Its other generation flags equal the Config defaults. Its optional add-noise step (noisy replay of the successes, "meant
# for latter project" per its comment) is not part of the generation we reproduce.
config:
  initialization: {initialization_noise_type: gaussian, initialization_noise_magnitude: 0.06}
# CP-Gen replays no source segment (it re-solves constraints). The original TrackMix methods (mixup_only, trackmix) keep
# their mixing off here, as in every CP-Gen run so far. The mixup exploration's mx_* methods mix the end-effector poses of
# two sources after both are solved for the current scene (tmg/generation/generators/cpgen/mixing.py). Its saved actions
# are already noise-free, so labels are pre_noise for every method.
method_overrides:
  none: {labels: pre_noise}
  tracking_only: {labels: pre_noise}
  mixup_only: {mixing: {enabled: false}, labels: pre_noise}
  trackmix: {mixing: {enabled: false}, labels: pre_noise}
