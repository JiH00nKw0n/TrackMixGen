# CP-Gen (kevin-thankyou-lin/cpgen @ 1e7c1fc4, cpgen-envs @ c4eea73e) on robosuite f687ae7c / MuJoCo 3.2.6 with
# cuRobo v0.7.8 motion planning (GPU). Constraint-preserving generation: each attempt re-solves the annotated
# keypoint constraints of one source demonstration for the new object poses and motion-plans between them.
name: cpgen
simulator: robosuite
image: tmg/cpgen
package: demo_aug
commit: 1e7c1fc4a467c7678c8542ca762e332d1757d8d5
source_repo: cpgen/datasets-src        # Hugging Face dataset repo of the source demonstrations and annotations
source_root: ${oc.env:TMG_CPGEN_SRC,/opt/src/cpgen}   # checkout: working directory of the chunk (relative config paths)
# Source text hash (sha256 of inspect.getsource) of the grafted DemoGenerator.generate_demo at the pinned commit
# (tests/unit/fixtures/cpgen_generate_demo.py holds that text); a changed package refuses to run.
graft_hashes: {generate_demo: a497e9da6ef4f84624c9646fd49ee55fae1dedaa93e428c90f8fa312972b40e2}
# demo_aug.generate.Config fields applied to every task (after the task's). The authors' launcher
# (scripts/pipeline/run_datagen_and_training.sh) sets the robot start-pose noise to Gaussian 0.06; the Config default is 0.02.
# Its other generation flags equal the Config defaults.
config:
  initialization: {initialization_noise_type: gaussian, initialization_noise_magnitude: 0.06}
# The launcher's add-noise and render-rgb steps, run by `tmg dataset` on the selected successes
# (tmg/generation/generators/cpgen/noisy_replay.py): every released training dataset is their output
# ("...-original-action-noisy-state-action-std-0.03-rgb-84-84.hdf5"), so the policies train on images rendered from
# states replayed with action noise 0.03, labelled with the original actions. num_processes is the launcher's 12;
# render_processes splits the rendering (it does not change the output).
# Its actions are absolute end-effector poses (position, axis-angle, gripper). The authors' training turns the rotation
# into the continuous 6D representation and normalizes only the position (tmg/policy/rotation.py); so does ours.
action_rotation: rotation_6d
noisy_state_replay: {enabled: true, num_retries: 6, action_noise_std: 0.03, num_processes: 12, render_processes: 12,
                     done_mode: 2, compress: true}
# CP-Gen replays no source segment (it re-solves constraints), so source mixing has no counterpart: the mixing
# part of every method is off. Its saved actions are already noise-free, so labels are pre_noise for every method.
method_overrides:
  none: {labels: pre_noise}
  tracking_only: {labels: pre_noise}
  mixup_only: {mixing: {enabled: false}, labels: pre_noise}
  trackmix: {mixing: {enabled: false}, labels: pre_noise}
