# SkillMix rule of cpgen threading (tmg fit_coefficients). Per subtask k, with phi_j = (|dx|, |dy|, rotation,
# inhand_position, inhand_rotation) of source j against the current scene (in-hand terms 0 for k = 0):
#   P(task succeeds | reached k, weights w) = sigmoid(c0 + sum_j w_j s_j + d H(w)),  s_j = a[j] + g . phi_j
#   weights: softmax(s / d) over the sources compatible with the selected one when d > 0, the best one when d <= 0
# Units: {'dx': 'm', 'dy': 'm', 'rotation': 'rad', 'inhand_position': 'm', 'inhand_rotation': 'rad'}.
generator: cpgen
task: threading
rule: softmax
basis: 'Fitted on 2026-11-20 on the A100 (scratch_calib/ana/fit_all.py, softmax form, without the older rank_human_demos pool;
  the model and fit of tmg fit_coefficients, which reproduced the CP-Gen Threading rule to 1e-13 from the same records) from
  /data/pools/cpgen/threading/ours/ours/mixup_only/pool_calib (method mixup_only with TMG_MIX_BETA_RANDOM=1 TMG_MIX_DIRICHLET=1:
  Dirichlet(c) weights, c ~ LogUniform(0.05, 20); selection ours, chunks of 25; for coffee, hammer_cleanup, mug_cleanup and
  three_piece_assembly also the chunks of the same pool made on the Isaac server, scratch_calib/ana/cp_isaac; the A100 runs
  also set TMG_CPGEN_RESOLVE_AFTER_BRIDGE=1, the re-solve after the bridge, cpgen.yaml resolve_after_bridge: true) and /data/pools/cpgen/threading/ours/ours/none/pool_ctrl
  (method none, the same code and settings); rows of subtask k: the attempts that reached it, label = the attempt''s task
  success.'
num_sources: 10
features:
- dx
- dy
- rotation
- inhand_position
- inhand_rotation
