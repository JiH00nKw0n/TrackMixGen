task: threading
rule: softmax
basis: 'Fit (tmg fit_coefficients) on the randmix pools [''/data/pools/cpgen/threading/ours/ours/mixup_only/pool_calib'',
  ''/data/scratch_calib/ana/cp_isaac/threading''] (2000 attempts) and the unmix pools [''/data/pools/cpgen/threading/ours/ours/none/pool_ctrl'']
  (2000 attempts); rows of subtask k: the attempts that reached it, label = the attempt''s task success.'
num_sources: 10
features:
- dx
- dy
- rotation
- inhand_position
- inhand_rotation
