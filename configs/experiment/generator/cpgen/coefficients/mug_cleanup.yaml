# Success-model coefficients of cpgen mug_cleanup (tmg fit_coefficients). Per subtask k:
#   P(subtask k succeeds | reached, source j) = sigmoid(alpha[j] + dx*|dx| + dy*|dy| + rotation*rot
#                                            + inhand_position*dpos + inhand_rotation*drot)  (in-hand terms k >= 1)
# Units: {'dx': 'm', 'dy': 'm', 'rotation': 'rad', 'inhand_position': 'm', 'inhand_rotation': 'rad'}. The source ranking is a separate file (../ranking/mug_cleanup.yaml).
generator: cpgen
task: mug_cleanup
basis: Maximum-likelihood fit (Newton, stabilizer 0.001) on the uniform-source baseline pool /data/pools/cpgen/mug_cleanup/ours/ours/none/rank_human_demos
  (3000 attempts, 60 chunks, scene ours, selection ours, generation rank_human_demos); one fit per subtask on the attempts
  that reached it, label = that subtask's success.
num_sources: 10
features:
  scene:
  - dx
  - dy
  - rotation
  inhand:
  - inhand_position
  - inhand_rotation
units:
  dx: m
  dy: m
  rotation: rad
  inhand_position: m
  inhand_rotation: rad
stabilizer: 0.001
subtask_term_signals:
- null
- null
- null
- null
