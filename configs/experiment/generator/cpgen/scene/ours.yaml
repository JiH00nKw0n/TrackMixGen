# Our scene for the CP-Gen experiments: the same ranges and reach constraint as the MimicGen experiments
# (configs/experiment/generator/mimicgen/scene/ours.yaml) for the five tasks CP-Gen runs, so the two generators
# are compared on one placement distribution. tests/unit/test_cpgen.py checks the two files agree.
# Registered environment class is <env_prefix>_OURS, derived from MimicGen's <env_prefix>_D0 class.
name: ours
generator: cpgen
env_suffix: OURS
base_env_suffix: D0
override_bounds: true
table_clip_m: 0.35
reach_constraint: {base_xy: [-0.56, 0.0], enabled: true, max_rejects: 500, radius_m: 0.85}
bounds:
  coffee:
    coffee_machine:
      x: [0.0, 0.2]
      y: [-0.25, -0.05]
      z_rot: [-0.5235987755982988, 1.0471975511965976]
      reference: table_offset
    coffee_pod:
      x: [-0.325, 0.175]
      y: [0.105, 0.35]
      z_rot: [0.0, 0.0]
      reference: table_offset
  threading:
