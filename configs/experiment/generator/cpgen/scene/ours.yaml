# Our scene for the CP-Gen experiments (decision 2026-10-29: CP-Gen runs in its own "Wide" environments): the placement
# ranges and reach constraint of the MimicGen experiments (configs/experiment/generator/mimicgen/scene/ours.yaml; tests check
# the two files agree) on top of CP-Gen's <env_prefix>Wide class, so every reset also draws the objects' size factors as
# in CP-Gen's official evaluation (per-task ranges in cpgen_envs/environments/manipulation/*.py). MimicGen's own
# experiments keep their environment without object scaling; the two generators are not run in one environment.
# Registered environment class is <env_prefix>_OURS, derived from <env_prefix>Wide.
name: ours
generator: cpgen
env_suffix: OURS
base_env_class: "{env_prefix}Wide"
override_bounds: true
table_clip_m: 0.35
reach_constraint: {base_xy: [-0.56, 0.0], enabled: true, max_rejects: 500, radius_m: 0.85}
bounds:
  coffee:
    coffee_machine:
      x: [0.0, 0.2]
      y: [-0.25, -0.05]
      z_rot: [-0.5235987755982988, 1.0471975511965976]
      reference: table_offset
    coffee_pod:
      x: [-0.325, 0.175]
      y: [0.105, 0.35]
      z_rot: [0.0, 0.0]
      reference: table_offset
  threading:
