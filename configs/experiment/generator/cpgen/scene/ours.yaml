      x: [-0.325, 0.175]
      y: [0.1, 0.3]
      z_rot: [-3.665191429188092, 0.5235987755982988]
      reference: table_offset
    tripod:
      x: [-0.225, 0.275]
      y: [-0.25, -0.1]
      z_rot: [0.5235987755982988, 2.6179938779914944]
      reference: table_offset
  hammer_cleanup:
    hammer:
      x: [-0.2, 0.35]
      y: [-0.31, -0.07]
      z_rot: [0.0, 6.283185307179586]
      rotation_axis: y
      reference: table_offset
    drawer:
      x: [-0.1, 0.3]
      y: [0.2, 0.35]
      z_rot: [-0.5235987755982988, 0.5235987755982988]
      reference: table_offset
  mug_cleanup:
