name: coffee
display_name: Coffee
env_prefix: Coffee              # robosuite environment class is <env_prefix>_<scene.env_suffix> (MimicGen's classes)
datagen_interface: MG_Coffee        # MimicGen interface used by the reach constraint to read object positions
source: ${paths.sources}/cpgen/coffee/source.hdf5
annotation: ${paths.sources}/cpgen/coffee/constraints.json
source_file: datasets/source/coffee.hdf5          # in generator.source_repo (cpgen/datasets-src)
annotation_file: datasets/source/coffee/constraints.json
num_sources: 10
source_indices: [0, 1]              # CP-Gen's default: the first source demonstration only ([start, end) of load_demos)
cpgen_config: {}                    # extra demo_aug.generate.Config fields for this task
subtasks: ['grasp pod', 'insert pod']
reference_objects: ['coffee_pod', 'coffee_machine']
horizon: 600                        # evaluation step limit (project decision 2026-10-27: 600 for every robosuite task; MimicGen's own values were 400/500)
cameras: ['agentview', 'robot0_eye_in_hand']
image_size: [84, 84]
robot_state: ['robot0_eef_pos', 'robot0_eef_quat', 'robot0_gripper_qpos']
object_state: [object]              # low-dim object observation (robosuite object-state: poses and relative positions)
instruction: pick up the coffee pod, insert it into the coffee machine and close the lid        # language instruction for π0
