# MimicGen's own D1 reset distribution. Nothing is overridden: the generator runs the public <env_prefix>_D1 class,
# so a `method=none` run stays byte-identical to the official generator. The ranges below are the values of that
# class's `_get_initial_placement_bounds` (mimicgen/envs/robosuite/*.py), listed so the scene is readable here;
# `tmg check_scene` compares them with the class and reports `bounds_match_class`.
# Units: metres relative to `reference` (table_offset = the table centre, or an explicit x, y, z), z_rot in radians.
name: official_d1
generator: mimicgen
env_suffix: D1
override_bounds: false
reach_constraint: {enabled: false}
bounds:
  square:
    nut: {x: [-0.115, 0.115], y: [-0.255, 0.255], z_rot: [0.0, 6.283185307179586], reference: [0.0, 0.0, 0.82]}
    peg: {x: [-0.1, 0.3], y: [-0.2, 0.2], z_rot: [0.0, 0.0], reference: [0.0, 0.0, 0.82]}
  coffee:
    coffee_machine: {x: [0.05, 0.15], y: [-0.2, -0.1], z_rot: [-0.5235987755982988, 1.0471975511965976], reference: table_offset}
    coffee_pod: {x: [-0.2, 0.05], y: [0.17, 0.3], z_rot: [0.0, 0.0], reference: table_offset}
  threading:
    needle: {x: [-0.2, 0.05], y: [0.15, 0.25], z_rot: [-3.665191429188092, 0.5235987755982988], reference: table_offset}
    tripod: {x: [-0.1, 0.15], y: [-0.2, -0.1], z_rot: [0.5235987755982988, 2.6179938779914944], reference: table_offset}
  stack_three:
    cubeA: {x: [-0.2, 0.2], y: [-0.2, 0.2], z_rot: [0.0, 6.283185307179586], reference: [0.0, 0.0, 0.8]}
    cubeB: {x: [-0.2, 0.2], y: [-0.2, 0.2], z_rot: [0.0, 6.283185307179586], reference: [0.0, 0.0, 0.8]}
    cubeC: {x: [-0.2, 0.2], y: [-0.2, 0.2], z_rot: [0.0, 6.283185307179586], reference: [0.0, 0.0, 0.8]}
  hammer_cleanup:
    hammer: {x: [-0.2, 0.2], y: [-0.25, -0.13], z_rot: [0.0, 6.283185307179586], rotation_axis: y, reference: table_offset}
    drawer: {x: [0.0, 0.2], y: [0.2, 0.3], z_rot: [-0.5235987755982988, 0.5235987755982988], reference: table_offset}
