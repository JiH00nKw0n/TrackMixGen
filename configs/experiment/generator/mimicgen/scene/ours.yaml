# Our scene for the MimicGen experiments. Ranges: the D1 centre of every object is kept, the x and y widths are
# doubled, and the range is clipped to +-0.35 m of the table centre; z_rot ranges are D1's, except Three Piece
# Assembly which takes D2's rotations (base +-45 deg, pieces 0 to 180 deg). On top of the ranges, a reach
# constraint redraws the reset until every task object lies within 0.85 m of the robot base (world x -0.56, y 0).
# Registered environment class is <env_prefix>_OURS. Units as in official_d1.yaml.
# Narrowed after the 2026-10-26 scene check (200 resets per task, tmg check_scene): bounds that put an object into
# the robot pedestal or the gripper's home pose were pulled back to the D1 value on that side only:
#   hammer_cleanup.hammer x lower -0.35 -> -0.2 (15/200 resets inside the pedestal; the table centre is at world x -0.2),
#   hammer_cleanup.drawer y lower 0.15 -> 0.2 (35/200 resets against the gripper fingers),
#   three_piece_assembly.* x lower -0.35 -> -0.28 (10/200 resets inside the pedestal),
# Three Piece Assembly (2026-10-27): set to MimicGen's D2 ranges exactly (x, y +-0.22 m, base yaw +-45 deg, pieces 0 to 180 deg);
#   with the doubled widths the baseline generator succeeded in 6.1 % of attempts (D2 in the paper: 31.3 %) and the low-dim
#   BC-RNN policy reached 0.2 % (paper D2: 38.7 %), so the task was out of reach for every method.
#   threading.tripod y upper -0.05 -> -0.1 (2/200 resets against the gripper fingers).
# Remaining after narrowing: hammer_cleanup drawer against the gripper in 22/200 resets. The same check on official_d1
# (2026-10-26) shows 64/200 such resets, so this contact comes from the task's own drawer placement near the gripper's
# home pose and the range is not narrowed further.
# Narrowed on 2026-11-04 (user decision) for Hammer Cleanup, Mug Cleanup, Threading and Three Piece Assembly; the other tasks
#   keep the ranges above. Outputs made before this change under <task>/ours must be moved aside before a rerun, because the
#   drivers reuse an existing dataset, evaluation-scene file and test result. For those four tasks every x and y
#   bound sits about halfway between MimicGen D1 and the 2026-10-26 ranges above, rounded to 0.05 m (0.025 m where the halfway
#   point falls between), and where the two differ by only 0.05 m the D1 bound is kept; z_rot stays D1's. Three Piece Assembly
#   keeps the D1/D2 positions and takes rotations halfway between D1 and D2 (base +-20 deg, pieces 45 to 135 deg). With the
#   2026-10-26 ranges the image baselines reached 0-35 % on these tasks (MimicGen paper at D1: 61-64 %).
name: ours
generator: mimicgen
env_suffix: OURS
override_bounds: true
table_clip_m: 0.35
reach_constraint:
  enabled: true
  radius_m: 0.85
  base_xy: [-0.56, 0.0]
  max_rejects: 500
bounds:
  square:
    nut: {x: [-0.23, 0.23], y: [-0.35, 0.35], z_rot: [0.0, 6.283185307179586], reference: [0.0, 0.0, 0.82]}
    peg: {x: [-0.3, 0.35], y: [-0.35, 0.35], z_rot: [0.0, 0.0], reference: [0.0, 0.0, 0.82]}
  coffee:
    coffee_machine: {x: [0.0, 0.2], y: [-0.25, -0.05], z_rot: [-0.5235987755982988, 1.0471975511965976], reference: table_offset}
    coffee_pod: {x: [-0.325, 0.175], y: [0.105, 0.35], z_rot: [0.0, 0.0], reference: table_offset}
  threading:
    needle: {x: [-0.25, 0.1], y: [0.125, 0.275], z_rot: [-3.665191429188092, 0.5235987755982988], reference: table_offset}
    tripod: {x: [-0.15, 0.2], y: [-0.2, -0.1], z_rot: [0.5235987755982988, 2.6179938779914944], reference: table_offset}
  stack_three:
    cubeA: {x: [-0.35, 0.35], y: [-0.35, 0.35], z_rot: [0.0, 6.283185307179586], reference: [0.0, 0.0, 0.8]}
    cubeB: {x: [-0.35, 0.35], y: [-0.35, 0.35], z_rot: [0.0, 6.283185307179586], reference: [0.0, 0.0, 0.8]}
    cubeC: {x: [-0.35, 0.35], y: [-0.35, 0.35], z_rot: [0.0, 6.283185307179586], reference: [0.0, 0.0, 0.8]}
  hammer_cleanup:
    hammer: {x: [-0.2, 0.25], y: [-0.275, -0.1], z_rot: [0.0, 6.283185307179586], rotation_axis: y, reference: table_offset}
    drawer: {x: [-0.05, 0.25], y: [0.2, 0.3], z_rot: [-0.5235987755982988, 0.5235987755982988], reference: table_offset}
  mug_cleanup:
    drawer: {x: [-0.2, 0.1], y: [0.25, 0.35], z_rot: [-0.5235987755982988, 0.5235987755982988], reference: table_offset}
    object: {x: [-0.3, 0.25], y: [-0.3, -0.1], z_rot: [0.0, 6.283185307179586], reference: table_offset}
  three_piece_assembly:                 # D1/D2 positions, rotations halfway between D1 and D2 (2026-11-04)
    base: {x: [-0.22, 0.22], y: [-0.22, 0.22], z_rot: [-0.3490658503988659, 0.3490658503988659], reference: table_offset}
    piece_1: {x: [-0.22, 0.22], y: [-0.22, 0.22], z_rot: [0.7853981633974483, 2.356194490192345], reference: table_offset}
    piece_2: {x: [-0.22, 0.22], y: [-0.22, 0.22], z_rot: [0.7853981633974483, 2.356194490192345], reference: table_offset}
