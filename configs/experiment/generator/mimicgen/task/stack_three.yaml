name: stack_three
display_name: Stack Three
env_prefix: StackThree
datagen_interface: MG_StackThree
template: stack_three.json
source: ${paths.sources}/mimicgen/stack_three/source.hdf5
source_registry_name: stack_three
num_sources: 10
subtasks: [grasp cube A, place on cube B, grasp cube C, place on cube A]
reference_objects: [cubeA, cubeB, cubeC, cubeA]
subtask_term_signals: [grasp_1, stack_1, grasp_2, null]   # MimicGen template subtask_term_signal per subtask (success labels of tmg fit_coefficients)
official_select_src_per_subtask: true   # MimicGen scripts/generate_core_configs.py and paper App. N.6: a source per subtask
                                        # (nearest_neighbor_object, nn_k 3, from the template); the template itself says false
horizon: 600                        # evaluation step limit (project decision 2026-10-27: 600 for every robosuite task; MimicGen's own values were 400/500)
cameras: [agentview, robot0_eye_in_hand]
image_size: [84, 84]
robot_state: [robot0_eef_pos, robot0_eef_quat, robot0_gripper_qpos]
object_state: [object]              # low-dim object observation (robosuite object-state: poses and relative positions)
instruction: stack the three cubes on top of each other        # language instruction for π0
mixing_symmetries:                  # logistic mixing (method.mixing.symmetries): a cube is the same after 90, 180 and 270 deg
  cubeA: &cube                      # about its vertical z axis
  - {rot_axis: z, rot_param: 1.5707963267948966, translation: [0, 0, 0]}
  - {rot_axis: z, rot_param: 3.141592653589793, translation: [0, 0, 0]}
  - {rot_axis: z, rot_param: 4.71238898038469, translation: [0, 0, 0]}
  cubeB: *cube
  cubeC: *cube
