name: stack_three
display_name: Stack Three
env_prefix: StackThree
datagen_interface: MG_StackThree
template: stack_three.json
source: ${paths.sources}/mimicgen/stack_three/source.hdf5
source_registry_name: stack_three
num_sources: 10
subtasks: [grasp cube A, place on cube B, grasp cube C, place on cube A]
reference_objects: [cubeA, cubeB, cubeC, cubeA]
horizon: 600                        # evaluation step limit (project decision 2026-10-27: 600 for every robosuite task; MimicGen's own values were 400/500)
cameras: [agentview, robot0_eye_in_hand]
image_size: [84, 84]
robot_state: [robot0_eef_pos, robot0_eef_quat, robot0_gripper_qpos]
object_state: [object]              # low-dim object observation (robosuite object-state: poses and relative positions)
instruction: stack the three cubes on top of each other        # language instruction for π0
