name: coffee
display_name: Coffee
env_prefix: Coffee
datagen_interface: MG_Coffee
template: coffee.json
source: ${paths.sources}/mimicgen/coffee/source.hdf5
source_registry_name: coffee
num_sources: 10
subtasks: [grasp pod, insert pod]
reference_objects: [coffee_pod, coffee_machine]
horizon: 600                        # evaluation step limit (project decision 2026-10-27: 600 for every robosuite task; MimicGen's own values were 400/500)
cameras: [agentview, robot0_eye_in_hand]
image_size: [84, 84]
robot_state: [robot0_eef_pos, robot0_eef_quat, robot0_gripper_qpos]
object_state: [object]              # low-dim object observation (robosuite object-state: poses and relative positions)
instruction: pick up the coffee pod, insert it into the coffee machine and close the lid        # language instruction for π0
