name: hammer_cleanup
display_name: Hammer Cleanup
env_prefix: HammerCleanup           # robosuite environment class is <env_prefix>_<scene.env_suffix>; needs robosuite_task_zoo
datagen_interface: MG_HammerCleanup # MimicGen environment interface
template: hammer_cleanup.json       # MimicGen config template under generator.templates
source: ${paths.sources}/mimicgen/hammer_cleanup/source.hdf5
source_registry_name: hammer_cleanup  # key in mimicgen.DATASET_REGISTRY["source"]
num_sources: 10
subtasks: [open drawer, grasp hammer, place hammer and close drawer]
reference_objects: [drawer, hammer, drawer]
subtask_term_signals: [open, grasp, null]   # MimicGen template subtask_term_signal per subtask (success labels of tmg fit_coefficients)
horizon: 600                        # evaluation step limit (project decision 2026-10-27: 600 for every robosuite task; MimicGen's own values were 400/500)
cameras: [agentview, robot0_eye_in_hand]
image_size: [84, 84]
robot_state: [robot0_eef_pos, robot0_eef_quat, robot0_gripper_qpos]
object_state: [object]              # low-dim object observation (robosuite object-state: poses and relative positions)
instruction: open the drawer, put the hammer inside and close the drawer        # language instruction for π0
mixing_symmetries:                  # logistic mixing (method.mixing.symmetries): the hammer is the same after 180 deg about its
  hammer:                           # handle axis (its z axis); CP-Gen's annotation uses the same symmetry for hammer_root
  - {rot_axis: z, rot_param: 3.141592653589793, translation: [0, 0, 0]}
