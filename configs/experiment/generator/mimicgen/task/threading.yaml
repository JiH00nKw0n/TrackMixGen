name: threading
display_name: Threading
env_prefix: Threading
datagen_interface: MG_Threading
template: threading.json
source: ${paths.sources}/mimicgen/threading/source.hdf5
source_registry_name: threading
num_sources: 10
subtasks: [grasp needle, thread needle]
reference_objects: [needle, tripod]
horizon: 600                        # evaluation step limit (project decision 2026-10-27: 600 for every robosuite task; MimicGen's own values were 400/500)
cameras: [agentview, robot0_eye_in_hand]
image_size: [84, 84]
robot_state: [robot0_eef_pos, robot0_eef_quat, robot0_gripper_qpos]
object_state: [object]              # low-dim object observation (robosuite object-state: poses and relative positions)
instruction: pick up the needle and thread it through the hole of the tripod        # language instruction for π0
