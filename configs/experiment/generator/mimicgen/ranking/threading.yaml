# Source ranking of MimicGen threading. Sources ordered from the highest to the lowest full-task generation success
# rate per subtask (ties: lower source index first). The good/bad split is not stored here; the method config
# chooses how many top sources count as high-success (method.mixing.good_fraction).
generator: mimicgen
task: threading
basis: Full-task generation success rate (successes / attempts) of each source demonstration, per subtask, measured in the
  2026-09 baseline pools (method off, scene wide + reach 0.85 m, 30,000 attempts per task). The source of a subtask is the
  demonstration the generator selected for that subtask.
split_note: The ranking only orders the sources. Which prefix counts as high-success is method.mixing.good_fraction.
