# Stage structure of mimicgen square (tmg/generation/simulators/scenes.py, load_task_stages). Kept out of the task config,
# which is part of the identity of every finished chunk.
# subtask_kinds: one kind per subtask of the task's SkillMix rule file, in order (grasp nut; insert nut);
# scripts/derive_coefficients.py chooses subtasks by kind (the conditions that mix only the grasp or only the place subtasks).
subtask_kinds: [grasp, place]
