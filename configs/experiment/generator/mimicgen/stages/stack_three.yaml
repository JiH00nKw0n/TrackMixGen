# Stage structure of mimicgen stack_three (tmg/generation/simulators/scenes.py, load_task_stages). Kept out of the task config,
# which is part of the identity of every finished chunk.
# subtask_kinds: one kind per subtask of the task's SkillMix rule file, in order (grasp cube A; place on cube B; grasp cube C; place on cube A);
# scripts/derive_coefficients.py chooses subtasks by kind (the conditions that mix only the grasp or only the place subtasks).
subtask_kinds: [grasp, place, grasp, place]
