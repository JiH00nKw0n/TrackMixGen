# Stage structure of mimicgen three_piece_assembly (tmg/generation/simulators/scenes.py, load_task_stages). Kept out of the task config,
# which is part of the identity of every finished chunk.
# subtask_kinds: one kind per subtask of the task's SkillMix rule file, in order (grasp piece 1; insert piece 1 into base; grasp piece 2; insert piece 2 into piece 1);
# scripts/derive_coefficients.py chooses subtasks by kind (the conditions that mix only the grasp or only the place subtasks).
subtask_kinds: [grasp, place, grasp, place]
