# SkillMix sparsemax rule of mimicgen hammer_cleanup (tmg fit_coefficients). Per subtask k, with phi_j = (|dx|, |dy|,
# rotation, inhand_position, inhand_rotation) of source j against the current scene (in-hand terms 0 for k = 0):
#   P(task succeeds | reached k, weights w) = sigmoid(c0 + sum_j w_j s_j + d spread(w)),
#   s_j = a[j] + g . phi_j,  spread(w) = 1 - sum_j w_j^2
#   weights: sparsemax(s / (2 d)) over the sources compatible with the selected one when d > 0, the best one when d <= 0
# Units: {'dx': 'm', 'dy': 'm', 'rotation': 'rad', 'inhand_position': 'm', 'inhand_rotation': 'rad'}.
generator: mimicgen
task: hammer_cleanup
rule: sparsemax
basis: 'Fitted on 2026-11-23 on the A100 with tmg fit_coefficients on the pools of softmax/hammer_cleanup.yaml:
  /data/pools/mimicgen/hammer_cleanup/ours/ours/mixup_only/pool_calib [the randmix pool; in this repository skillmix_randmix/pool_randmix]
  (2,000 attempts) and /data/pools/mimicgen/hammer_cleanup/ours/ours/none/pool_ctrl [the unmix pool; in this repository none/pool_unmix]
  (2,000 attempts); rows of subtask k: the attempts that reached it, label = the attempt''s task success. Equal to
  within 2e-13 to the rule the MimicGen sparsemax pools of 2026-11-21 were generated with (ana/fit_all.py, gini form).'
num_sources: 10
features:
- dx
- dy
- rotation
- inhand_position
- inhand_rotation
units:
  dx: m
  dy: m
  rotation: rad
  inhand_position: m
  inhand_rotation: rad
