# Success-model coefficients of mimicgen three_piece_assembly (tmg fit_coefficients). Per subtask k:
#   P(task succeeds | reached subtask k, source j for k) = sigmoid(alpha[j] + dx*|dx| + dy*|dy| + rotation*rot
#                                            + inhand_position*dpos + inhand_rotation*drot)  (in-hand terms k >= 1)
# Units: {'dx': 'm', 'dy': 'm', 'rotation': 'rad', 'inhand_position': 'm', 'inhand_rotation': 'rad'}. The source ranking is a separate file (../ranking/three_piece_assembly.yaml).
generator: mimicgen
task: three_piece_assembly
basis: Maximum-likelihood fit (Newton, stabilizer 0.001) on the uniform-source baseline pool /data/pools/mimicgen/three_piece_assembly/ours/ours/none/rank_human_demos
  (3000 attempts, 24 chunks, scene ours, selection ours, generation rank_human_demos); one fit per subtask on the attempts
  that reached it, label = the attempt's task success.
num_sources: 10
features:
  scene:
  - dx
  - dy
  - rotation
  inhand:
  - inhand_position
  - inhand_rotation
units:
  dx: m
  dy: m
  rotation: rad
  inhand_position: m
  inhand_rotation: rad
stabilizer: 0.001
subtask_term_signals:
- grasp_1
- insert_1
- grasp_2
- null
