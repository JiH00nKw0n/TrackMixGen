# Success-model coefficients of mimicgen stack_three (tmg fit_coefficients). Per subtask k:
#   P(subtask k succeeds | reached, source j) = sigmoid(alpha[j] + dx*|dx| + dy*|dy| + rotation*rot
#                                            + inhand_position*dpos + inhand_rotation*drot)  (in-hand terms k >= 1)
# Units: {'dx': 'm', 'dy': 'm', 'rotation': 'rad', 'inhand_position': 'm', 'inhand_rotation': 'rad'}. The source ranking is a separate file (../ranking/stack_three.yaml).
generator: mimicgen
task: stack_three
basis: Maximum-likelihood fit (Newton, stabilizer 0.001) on the uniform-source baseline pool /data/pools/mimicgen/stack_three/ours/ours/none/rank_human_demos
  (3000 attempts, 12 chunks, scene ours, selection ours, generation rank_human_demos); one fit per subtask on the attempts
  that reached it, label = that subtask's success.
num_sources: 10
features:
  scene:
  - dx
  - dy
  - rotation
  inhand:
  - inhand_position
  - inhand_rotation
units:
  dx: m
  dy: m
  rotation: rad
  inhand_position: m
  inhand_rotation: rad
stabilizer: 0.001
subtask_term_signals:
- grasp_1
- stack_1
- grasp_2
- null
