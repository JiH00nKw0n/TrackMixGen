task: coffee
rule: softmax
basis: 'Fitted on 2026-11-20 on the A100 (scratch_calib/ana/fit_all.py, softmax form, without the older rank_human_demos pool;
  the model and fit of tmg fit_coefficients, which reproduced the CP-Gen Threading rule to 1e-13 from the same records) from
  /data/pools/mimicgen/coffee/ours/ours/mixup_only/pool_calib (method mixup_only with TMG_MIX_DIRICHLET=1: Dirichlet(c) weights,
  c ~ LogUniform(0.05, 20); selection ours, pool_robosuite_lowdim settings, 2,000 attempts in chunks of 50) and /data/pools/mimicgen/coffee/ours/ours/none/pool_ctrl
  (method none, the same code, settings and chunk seeds, 2,000 attempts); rows of subtask k: the attempts that reached it,
  label = the attempt''s task success.'
