# SkillMix rule of mimicgen threading (tmg fit_coefficients). Per subtask k, with phi_j = (|dx|, |dy|, rotation,
# inhand_position, inhand_rotation) of source j against the current scene (in-hand terms 0 for k = 0):
#   P(task succeeds | reached k, weights w) = sigmoid(c0 + sum_j w_j s_j + d H(w)),  s_j = a[j] + g . phi_j
#   weights: softmax(s / d) over the sources compatible with the selected one when d > 0, the best one when d <= 0
# Units: {'dx': 'm', 'dy': 'm', 'rotation': 'rad', 'inhand_position': 'm', 'inhand_rotation': 'rad'}.
generator: mimicgen
task: threading
rule: softmax
basis: 'Fitted on 2026-11-20 on the A100 (scratch_calib/ana/fit_all.py, softmax form, without the older rank_human_demos pool;
  the model and fit of tmg fit_coefficients, which reproduced the CP-Gen Threading rule to 1e-13 from the same records) from
  /data/pools/mimicgen/threading/ours/ours/mixup_only/pool_calib (method mixup_only with TMG_MIX_DIRICHLET=1: Dirichlet(c)
  weights, c ~ LogUniform(0.05, 20); selection ours, pool_robosuite_lowdim settings, 2,000 attempts in chunks of 50) and /data/pools/mimicgen/threading/ours/ours/none/pool_ctrl
  (method none, the same code, settings and chunk seeds, 2,000 attempts); rows of subtask k: the attempts that reached it,
  label = the attempt''s task success.'
num_sources: 10
features:
- dx
- dy
- rotation
- inhand_position
- inhand_rotation
units:
  dx: m
  dy: m
  rotation: rad
  inhand_position: m
  inhand_rotation: rad
