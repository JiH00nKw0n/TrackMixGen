# DexMimicGen on the GR1 humanoid (two dexterous hands), run through NVIDIA AutoData (isaac-sim/AutoData @ 835f4aab, the
# DexMimicGen rewrite, package autodata_core) on Isaac Lab-Arena @ 481f5ae5 with its nested Isaac Lab 3.0 (28a386f0) and
# Isaac Sim 6.1. One stack and one image (tmg/isaaclab-dex, docker/isaaclab-dex.Dockerfile) for the three GR1 tasks of the
# paper plan: Pick Place (Isaac Lab Mimic's environment Isaac-PickPlace-GR1T2-Abs-Mimic-v0, registered by the nested Isaac
# Lab's isaaclab_mimic; its official AutoData task descriptor gr1_pick_place.yaml carries the same generation settings as the
# Isaac Lab Mimic environment config), Microwave Opening and Bottle Placement and Door Closing (Arena environments registered
# through Arena's callback, task.external_callback). Decision 2026-10-29: until then Pick Place ran on a separate Isaac Lab
# 2.x image (isaaclab_mimic directly) and the Arena tasks under a generator named autodata.
name: dexmimicgen
simulator: isaaclab
image: tmg/isaaclab-dex
package: autodata_core                     # DataGenerator, MultiWaypoint (a rewrite of isaaclab_mimic.datagen, not that package)
commit: 835f4aab0fff759a789586454d939f12a9a40997
arena_commit: 481f5ae5f19df7bc5d24a17240fc0d96ac81eaf7
isaaclab_commit: 28a386f063e41c04c07f50e63eefb83fd8408fbe
source_root: ${oc.env:TMG_AUTODATA_SRC,/opt/src/AutoData}
script: scripts/generate_dataset.py
embodiment: autodata_examples/embodiments/gr1_ik_abs.yaml      # GR1 whole-body IK, absolute poses, 36-D action
kit_args: null
extra_args: []
# Source text hashes of the grafted functions (sha256 of inspect.getsource); null = not pinned yet, the first chunk
# run prints the installed hashes under "hashes". Pin them afterwards so a changed package refuses to run.
graft_hashes: {generate: null, trajectory: null, execute: null}
# action: [left pos 3, left quat 4, right pos 3, right quat 4, left hand 11, right hand 11] (gr1_ik_abs.yaml). AutoData's
# embodiment adapter splits the hands itself (gripper_action_indices), so no hand layout by joint-name prefix is needed.
eefs: [left, right]
arm_action_dims: {left: [0, 7], right: [7, 14]}
hand_prefixes: null
hand_term: null
# the IK tasks target the pitch links while the observations read the roll links; the follower measures its error on the
# target links (2026-10-26 analysis of the Isaac Lab Mimic GR1 controller; Arena's GR1 uses the same links)
measure_links: {left: left_hand_pitch_link, right: right_hand_pitch_link}
# randn_like draws of AutoData's target_eef_pose_to_action per step, in order: left pos, left quat, right pos, right quat;
# a hand whose noise scale is zero at that step draws nothing (the tracking loop's noise ledger tolerates fewer draws)
noise_draw_shapes: [3, 4, 3, 4]
method_overrides:
  trackmix:
    mixing: {max_anchor_rotation_deg: 40.0}
    tracking: {gripper_events: {type: closure, columns: [0, 1, 2, 3]}}   # a hand's 11 commands: proximal index, middle, pinky, ring first
  mixup_only:
    mixing: {max_anchor_rotation_deg: 40.0}
  tracking_only:
    tracking: {gripper_events: {type: closure, columns: [0, 1, 2, 3]}}
