# DexMimicGen on the GR1 humanoid (two dexterous hands), run through NVIDIA AutoData (isaac-sim/AutoData @ 835f4aab, the
# DexMimicGen rewrite, package autodata_core) on Isaac Lab-Arena @ 481f5ae5 with its nested Isaac Lab 3.0 (28a386f0) and
# Isaac Sim 6.1. One stack and one image (tmg/isaaclab-dex, docker/isaaclab-dex.Dockerfile) for the three GR1 tasks of the
# paper plan: Pick Place (Isaac Lab Mimic's environment Isaac-PickPlace-GR1T2-Abs-Mimic-v0, registered by the nested Isaac
# Lab's isaaclab_mimic; its official AutoData task descriptor gr1_pick_place.yaml carries the same generation settings as the
# Isaac Lab Mimic environment config), Microwave Opening and Bottle Placement and Door Closing (Arena environments registered
# through Arena's callback, task.external_callback). Decision 2026-10-29: until then Pick Place ran on a separate Isaac Lab
# 2.x image (isaaclab_mimic directly) and the Arena tasks under a generator named autodata.
name: dexmimicgen
simulator: isaaclab
image: tmg/isaaclab-dex
package: autodata_core                     # DataGenerator, MultiWaypoint (a rewrite of isaaclab_mimic.datagen, not that package)
commit: 835f4aab0fff759a789586454d939f12a9a40997
arena_commit: 481f5ae5f19df7bc5d24a17240fc0d96ac81eaf7
isaaclab_commit: 28a386f063e41c04c07f50e63eefb83fd8408fbe
source_root: ${oc.env:TMG_AUTODATA_SRC,/opt/src/AutoData}
script: scripts/generate_dataset.py
embodiment: autodata_examples/embodiments/gr1_ik_abs.yaml      # GR1 whole-body IK, absolute poses, 36-D action
kit_args: null
extra_args: []
# Source text hashes of the grafted functions (sha256 of inspect.getsource) at AutoData 835f4aab, read from the first chunk
# log of 2026-10-29 (the chunk prints them under "hashes"); a changed package refuses to run.
graft_hashes:
  generate: 8b078b39492e9e3c96275d7ccea7542cce08709a1db85eefbe8801f598866ccd      # DataGenerator.generate
  trajectory: a76d66dd0d1e548720dc712c50c65b23cecd899d6552d1bd50e5396d31c5d4a2    # DataGenerator.generate_eef_subtask_trajectory
  execute: ddbc84684bb9259304f17c20657f1d526b4cf30a832c6a191195f7e0443a6829       # MultiWaypoint.execute
# action: [left pos 3, left quat 4, right pos 3, right quat 4, left hand 11, right hand 11] (gr1_ik_abs.yaml). AutoData's
# embodiment adapter splits the hands itself (gripper_action_indices), so no hand layout by joint-name prefix is needed.
eefs: [left, right]
arm_action_dims: {left: [0, 7], right: [7, 14]}
hand_prefixes: null
hand_term: null
# the IK tasks target the pitch links while the observations read the roll links; the records measure the pose on the
# target links (2026-10-26 analysis of the Isaac Lab Mimic GR1 controller; Arena's GR1 uses the same links)
measure_links: {left: left_hand_pitch_link, right: right_hand_pitch_link}
# randn_like draws of AutoData's target_eef_pose_to_action per step, in order: left pos, left quat, right pos, right quat;
# a hand whose noise scale is zero at that step draws nothing (the tracking loop's noise ledger tolerates fewer draws)
noise_draw_shapes: [3, 4, 3, 4]
# How the runtime reads a subtask's scene for the records and SkillMix (tmg/generation/generators/isaaclab/runtime.py).
# held_rule: a hand counts as holding the previous subtask's reference object when the object's origin is within rigid_m
#   of the end effector (rigid object) or its nearest simulation node within nodes_m (deformable). A grasp leaves the
#   object at the hand (Rope: 2 to 7 mm to the nearest node); a hand that only reached, pushed or supported the object is
#   0.4 to 1.3 m away (GR1 Bottle Placement pilot, 2026-11-27). The rule is written into every record and into the rule
#   file, and the mixer refuses a rule file fitted with another one. Change the values only together with `version`.
# unversioned_held_rule: the rule of records without a record_version (made by the code up to commit 2fcfc0d, 2026-11-27,
#   where these two distances were constants and were not recorded); tmg fit_coefficients reads such records with it.
# max_error_rate: the largest share of a chunk's attempts whose subtask scene may fail to read (e.g. a towel folded so far
#   that its nodal frame has no yaw) before a calibration or mixing pool fails the chunk and stops.
# Not part of a chunk's identity (ChunkSpec.scene_reading): it changes no unmixed demonstration.
scene_reading:
  held_rule: {version: 1, rigid_m: 0.20, nodes_m: 0.10}
  unversioned_held_rule: {version: 1, rigid_m: 0.20, nodes_m: 0.10}
  max_error_rate: 0.1
# Sanity limits of tmg fit_coefficients and of every chunk result (tmg/generation/method/fit_records.py sanity_report): a
# successful attempt completed every subtask, so when more than this share of a block's successful attempts (of at least
# min_successes) counts as not having reached it, the reached rule misreads the records and the fit (or the pool) stops.
# Which reached rule a task uses is the task's own fit.reached (default term_window; task_success where the environment
# publishes no per-step subtask signal).
fit:
  max_unreached_success_rate: 0.2
  min_successes: 10
method_overrides:
  skillmix: &closure_events        # the mixer aligns segments by the hands' closure events (a hand's 11 commands:
    mixing: {gripper_events: {type: closure, columns: [0, 1, 2, 3]}}   # proximal index, middle, pinky, ring first)
  skillmix_sample: *closure_events
  skillmix_randmix:             # the randmix pools of the SkillMix fit (method skillmix, rule randmix)
    mixing: {gripper_events: {type: closure, columns: [0, 1, 2, 3]}}
