# DexMimicGen as shipped in Isaac Lab (isaaclab_mimic, isaac-sim/IsaacLab @ 3c6e67bb) on Isaac Sim 5.1.
# GR1 humanoid with two dexterous hands; the robosuite DexMimicGen repository is not used.
name: dexmimicgen
simulator: isaaclab
image: tmg/isaaclab-dex
package: isaaclab_mimic.datagen
isaaclab_commit: 3c6e67bb5c7ada942a6d1884ab69338f57596f77
source_root: ${oc.env:TMG_ISAACLAB_SRC,/opt/src/IsaacLab}
script: scripts/imitation_learning/isaaclab_mimic/generate_dataset.py
kit_args: "--/renderer/multiGpu/enabled=false --/renderer/activeGpu=0"
extra_args: [--enable_pinocchio]
graft_hashes: {generate: null, trajectory: null, execute: null}
# action: [left pos 3, left quat 4, right pos 3, right quat 4, 22 hand joints]; hands are grouped by joint-name prefix
# because the controller interleaves the two hands (the official actions[:, 14:25] split mixes them).
eefs: [left, right]
arm_action_dims: {left: [0, 7], right: [7, 14]}
hand_prefixes: {left: L_, right: R_}
hand_term: upper_body_ik
# the IK tasks target the pitch links while the observations read the roll links; the follower measures its error
# on the target links (2026-10-26 analysis)
measure_links: {left: left_hand_pitch_link, right: right_hand_pitch_link}
noise_draw_shapes: [3, 3, 4, 4]        # randn_like calls per step: left pos, right pos, left quat, right quat
method_overrides:
  trackmix:
    mixing: {max_anchor_rotation_deg: 40.0}
    tracking: {gripper_events: {type: closure, columns: [0, 1, 2, 3]}}
  mixup_only:
    mixing: {max_anchor_rotation_deg: 40.0}
  tracking_only:
    tracking: {gripper_events: {type: closure, columns: [0, 1, 2, 3]}}
