name: pick_place
display_name: GR1 Pick and Place
env_name: Isaac-PickPlace-GR1T2-Abs-Mimic-v0
camera_env: TMG-PickPlace-GR1T2-Images-Mimic-v0   # the official task has no cameras; registered by camera_module
camera_module: tmg.generation.simulators.isaaclab_tasks.gr1_pickplace_cameras
source: ${paths.sources}/dexmimicgen/pick_place/source.hdf5
source_url: https://omniverse-content-production.s3-us-west-2.amazonaws.com/Assets/Isaac/5.1/Isaac/IsaacLab/Mimic/pick_place_datasets/dataset_annotated_gr1.hdf5   # Isaac Lab docs (teleop_imitation.rst, commit 3c6e67bb)
num_sources: 5
subtasks: [right idle until grasp, right place; left grasp and hold]
reference_objects: [object, object]
horizon: 400                        # the environment's own episode length (20 s at 20 Hz); the task has no official image-policy config
eval_episode_length_s: 30.0         # the env's own limit is 20 s = 400 steps at 20 Hz; the evaluation must raise episode_length_s to cover the horizon
cameras: [front_image, side_image]
image_size: [128, 128]
robot_state: [left_eef_pos, left_eef_quat, right_eef_pos, right_eef_quat, hand_joint_state]
object_state: []                    # low-dim training is not set up for the Isaac Lab tasks yet
instruction: pick up the object with the right hand and place it in the bin
# Isaac Lab has no official image policy config for GR1 pick-and-place (only bc_rnn_low_dim.json). Its GR1 image configs
# (nut pouring, exhaust pipe) crop the 160x256 camera to 144x236, i.e. 90% of each side, so the image policies here use the
# same ratio on our 128x128 cameras: crop_shape auto = 76/84 of the side = 116x116.
policy_overrides:
  bc_rnn: {crop_shape: auto}
  diffusion_policy: {crop_shape: auto}
