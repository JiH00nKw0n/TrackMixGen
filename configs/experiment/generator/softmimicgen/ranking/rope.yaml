# Source ranking of softmimicgen rope. Sources ordered from the highest to the lowest full-task generation
# success rate per subtask (ties: lower source index first). The good/bad split is not stored here; the
# method config chooses how many top sources count as high-success (method.mixing.good_fraction).
generator: softmimicgen
task: rope
basis: Full-task generation success rate (successes / attempts) of each source demonstration, per subtask, measured by tmg
  rank_sources on the baseline pool /data/pools/softmimicgen/rope/ours/none/rank_human_demos (3000 attempts, 12 chunks, scene
  ours, generation rank_human_demos). The source of a subtask is the demonstration the generator selected for that subtask.
split_note: The ranking only orders the sources. Which prefix counts as high-success is method.mixing.good_fraction.
subtasks:
  0:
    order: [2, 0, 1]
    attempts: {2: 997, 0: 1016, 1: 987}
    successes: {2: 606, 0: 548, 1: 439}
    rate: {2: 0.6078, 0: 0.5394, 1: 0.4448}
