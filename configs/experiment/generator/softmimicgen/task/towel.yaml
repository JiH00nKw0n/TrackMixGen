name: towel
display_name: Franka Fold Towel
env_name: Isaac-Fold-Towel-Franka-IK-Rel-Mimic-v0   # read from the dataset's env args by the official script
camera_env: null                        # the official task already records agentview and eye-in-hand images
camera_module: null
source: ${paths.sources}/softmimicgen/towel/source.hdf5
source_file: annotated_dataset/annotated_dataset_franka_towel.hdf5   # file in generator.source_repo
num_sources: 3                          # three human demonstrations in the official source file (manifest of 2026-10-29)
subtasks: [grasp towel corner, fold towel]
reference_objects: [object, object]
horizon: 400                        # evaluation step limit (project decision 2026-10-26: SoftMimicGen 400, DexMimicGen 600; the official robomimic rollout horizon is 220)
eval_episode_length_s: 20.0         # the env's own limit is 10 s = 200 steps at 20 Hz; the evaluation must raise episode_length_s to cover the horizon
cameras: [agentview_image, robot0_eye_in_hand_image]
image_size: [128, 128]
robot_state: [robot0_eef_pos, robot0_eef_quat, robot0_gripper_qpos]
object_state: [towel_state]         # 111 = 6x6 grid of towel nodes (108) + eef to the towel centroid (3); see lowdim_terms
# Low-dim object observation (decision 2026-10-29): the official environment records no towel term (5,989 nodes only in the
# simulator state), so a 6x6 grid of nodes is picked once on the towel's rest plane, positions in the environment frame, plus
# the vector from the end-effector (sensor ee_frame) to the towel centroid. Added to the policy group at generation and
# evaluation (tmg/generation/simulators/isaaclab_lowdim.py); pools made before 2026-10-29 lack it.
lowdim_terms:
  towel_state:
    func: tmg.generation.simulators.isaaclab_lowdim:deformable_nodes
    params: {object: object, layout: grid, counts: [6, 6], relative: centroid, eef: {sensor: ee_frame}}
instruction: fold the towel in half
# Official generation settings (softmimicgen/envs/franka_towel_ik_rel_mimic_env_cfg.py @ c9d146ba), used unchanged:
# one source per attempt (select_src_per_subtask False), selection registration_cost (nn_k 3), action noise 0.01,
# interpolation steps 5 and 5, relative actions, failed attempts kept, generation_guarantee (trials count successes).
success_term: {name: object_folded, first_call: after_first_action}
# Official policy settings (softmimicgen_tasks/<task>/config/agents/robomimic/*.json @ c9d146ba): BC-RNN crops the 128x128
# images to 76x76 (CropRandomizer), the Diffusion Policy uses NO crop randomizer; both train on agentview_image and
# robot0_eye_in_hand_image with the three robot-state terms. The evaluation horizon above is the project decision, not the official 220.
# Decision 2026-10-29: the Isaac Lab tasks share one rule, no image crop for either policy (the official BC-RNN config's 76x76
# crop is not followed, so that Rope, Towel and Pick Place use the same preprocessing); MimicGen keeps its official 76x76.
policy_overrides:
  bc_rnn: {crop_shape: null}
  diffusion_policy: {crop_shape: null}
