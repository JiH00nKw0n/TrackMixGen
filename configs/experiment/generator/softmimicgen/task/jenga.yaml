name: jenga
display_name: Franka Jenga
env_name: Isaac-Jenga-Franka-IK-Rel-Mimic-v0   # read from the dataset's env args by the official script
camera_env: null                        # the official task already records agentview and eye-in-hand images
camera_module: null
source: ${paths.sources}/softmimicgen/jenga/source.hdf5
source_file: annotated_dataset/annotated_dataset_franka_jenga.hdf5   # file in generator.source_repo
num_sources: null                       # not checked against the file: the manifest written by `tmg sources` records the count
subtasks: [grasp block, place block on the tower]
reference_objects: [object, jenga]
horizon: 250                        # official rollout horizon of the task's robomimic configs (jenga: taken as rope's; its own config was not read)
eval_episode_length_s: 15.0         # the env's own limit is 10 s = 200 steps at 20 Hz; the evaluation must raise episode_length_s to cover the horizon
cameras: [agentview_image, robot0_eye_in_hand_image]
image_size: [128, 128]
robot_state: [robot0_eef_pos, robot0_eef_quat, robot0_gripper_qpos]
object_state: []                    # low-dim training is not set up for the Isaac Lab tasks yet
instruction: pick up the block and place it on the jenga tower
# Official generation settings (softmimicgen/envs/franka_jenga_ik_rel_mimic_env_cfg.py @ c9d146ba), used unchanged:
# sources chosen per subtask (select_src_per_subtask True, unlike rope and towel), selection registration_cost for the
# grasp and nearest_neighbor_object for the placement (nn_k 3), action noise 0.01, interpolation steps 5 and 5,
# relative actions, failed attempts kept, generation_guarantee (trials count successes).
success_term: {name: object_reached_goal, first_call: after_first_action}
# Official policy settings (softmimicgen_tasks/<task>/config/agents/robomimic/*.json @ c9d146ba): BC-RNN crops the 128x128
# images to 76x76 (CropRandomizer), the Diffusion Policy uses NO crop randomizer; both train on agentview_image and
# robot0_eye_in_hand_image with the three robot-state terms. The evaluation horizon below is the official rollout horizon.
policy_overrides:
  bc_rnn: {crop_shape: [76, 76]}
  diffusion_policy: {crop_shape: null}
