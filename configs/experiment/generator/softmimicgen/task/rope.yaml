name: rope
display_name: Franka Rope
env_name: Isaac-Rope-Franka-IK-Rel-Mimic-v0   # read from the dataset's env args by the official script
camera_env: null                        # the official task already records agentview and eye-in-hand images
camera_module: null
source: ${paths.sources}/softmimicgen/rope/source.hdf5
source_file: annotated_dataset/annotated_dataset_franka_rope.hdf5   # file in generator.source_repo
num_sources: 3
subtasks: [grasp rope, shape rope]
reference_objects: [rope, rope]
horizon: 250                        # official rollout horizon of the task's robomimic configs
eval_episode_length_s: 15.0         # the env's own limit is 10 s = 200 steps at 20 Hz; the evaluation must raise episode_length_s to cover the horizon
cameras: [agentview_image, robot0_eye_in_hand_image]   # observation term names = hdf5 obs keys (2026-10-28 check of a generated file)
image_size: [128, 128]
robot_state: [robot0_eef_pos, robot0_eef_quat, robot0_gripper_qpos]   # (3) + (4) + (2); the official env's observation terms
object_state: []                    # low-dim training is not set up for the Isaac Lab tasks yet
instruction: pick up the rope and shape it into a U
# Success term timing (2026-10-27 audit): rope_ends_close_tracked picks the two rope end nodes at its FIRST call of an
# episode and keeps them; the official generator and evaluator first call it after the first action. Calling it right
# after reset picks other nodes (the rope has not settled) and changes the verdict. Generation only reads the official
# value; an evaluation must call the term after the first action onwards, never at reset, and leave the reset event
# reset_rope_end_tracking in place.
success_term: {name: rope_ends_close_tracked, first_call: after_first_action}
# Official policy settings (softmimicgen_tasks/<task>/config/agents/robomimic/*.json @ c9d146ba): BC-RNN crops the 128x128
# images to 76x76 (CropRandomizer), the Diffusion Policy uses NO crop randomizer; both train on agentview_image and
# robot0_eye_in_hand_image with the three robot-state terms. The evaluation horizon below is the official rollout horizon.
policy_overrides:
  bc_rnn: {crop_shape: [76, 76]}
  diffusion_policy: {crop_shape: null}
