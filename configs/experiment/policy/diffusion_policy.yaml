# Diffusion Policy: LeRobot 0.6.1 DiffusionPolicy with the official image U-Net values (real-stanford/diffusion_policy,
# robomimic image config). Only fields that differ from LeRobot's defaults are listed.
# The architecture and the noise schedule are the same as in the official implementation. They are LeRobot defaults (down_dims
# 512/1024/2048, kernel 5, 8 groups, step embed 128, DDPM 100 steps squaredcos_cap_v2, epsilon prediction, clip_sample,
# spatial softmax 32, cosine schedule with 500 warmup steps). Since 2026-10-30 the optimizer and the crop are too. The code
# builds AdamW (LeRobot's preset is Adam) with the preset's values (lr 1e-4, betas 0.95/0.999, weight decay 1e-6, eps
# 1e-8), and crops every training image at its own random location (tmg/policy/augment.py). Evaluation center-crops.
# Normalization differs from the official implementation. It stays LeRobot's (images mean/std per channel, state and
# actions min-max to [-1, 1]). The official robomimic-image Diffusion Policy maps images from [0, 1] to [-1, 1], keeps
# relative actions and quaternions unchanged (identity) and min-maxes positions and gripper joints
# (diffusion_policy/dataset/robomimic_replay_image_dataset.py lines 148-185). The gradient norm is clipped at 1000
# (training.grad_clip_norm). The official implementation does not clip.
name: diffusion_policy
pretrained_path: null
params:
  n_obs_steps: 2
  horizon: 16                    # LeRobot default 64
  n_action_steps: 8              # LeRobot default 32
  drop_n_last_frames: 7          # horizon - n_action_steps - n_obs_steps + 1
  crop_shape: [76, 76]           # robomimic/MimicGen image crop (84x84 -> 76x76); tasks with other official crops set task.policy_overrides
  crop_is_random: true
  use_group_norm: true           # official: GroupNorm ResNet18 trained from scratch
  pretrained_backbone_weights: null
by_observation:
  image: {}
  low_dim:                       # official low-dim U-Net (train_diffusion_unet_lowdim_workspace): narrower U-Net, step embedding 256
    down_dims: [256, 512, 1024]
    diffusion_step_embed_dim: 256
    crop_shape: null
ema: true                        # the official implementation evaluates the EMA weights (power 0.75)
