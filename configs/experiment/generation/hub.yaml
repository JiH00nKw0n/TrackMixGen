defaults:
  - pool_robosuite_image
  - _self_
# Training datasets made elsewhere and published on the Hugging Face Hub, for training and evaluation without generating
# a pool. `tmg dataset` (`make dataset GENERATION=hub`) downloads `hub.filename` of `hub.repo_id` into the usual dataset
# path (.../<method>/hub/<observation>/n<size>_seed<seed>.hdf5) when that file is missing; train, validate and evaluate
# with the same GENERATION=hub. The file is used as it is: it must hold `size` demonstrations (1,000 per task), made with
# the scene, selection and method of the command line (SkillMix: SCENE=ours SELECTION=ours METHOD=skillmix) and the
# image observation. The fixed evaluation scenes (`make resets`) are still drawn locally.
name: hub
hub:
  repo_id: Mayfull/Mimicgen-skillmix   # public dataset repository: one hdf5 per task
  repo_type: dataset
  filename: ${task.name}.hdf5          # file name in the repository
  revision: null                       # branch, tag or commit; null = the default branch
