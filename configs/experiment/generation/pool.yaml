defaults:
  - pilot20
  - _self_
# Full pool: enough attempts for 1,000 successes per task; attempts are set per task on the command line
# (generation.attempts=...). Chunks of 250 attempts, seeds from 30001.
name: pool
protocol:
  camera_names: ${task.cameras}     # full pools store the images the policies train on (no replay rendering exists)
  camera_size: ${task.image_size}
attempts: 10000
chunk: 250
seed_offset: 30000
