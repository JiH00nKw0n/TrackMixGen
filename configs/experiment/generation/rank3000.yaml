defaults:
  - pool
  - _self_
# Baseline pool for ranking the source demonstrations: 3,000 attempts (300 per source for a task with 10 sources,
# roughly 30 to 100 successes per source at 10 to 30 % generation success) in chunks of 250, seeds from 20001.
# Same protocol as `pool`.
name: rank3000
protocol:
  camera_names: []                  # ranking pools need no images
attempts: 3000
chunk: 250
seed_offset: 20000
