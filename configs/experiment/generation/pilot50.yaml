# Scene check at 50 successes in one chunk (Isaac Lab generators: num_trials counts successes). Same code path as a full pool.
name: pilot50
attempts: 50
chunk: 50
seed_offset: 9500                 # chunk seed 9501
protocol:
  keep_failed: true
  max_num_failures: null
  guarantee: false
  select_src_per_subtask: true
  selection_strategy: random
  selection_strategy_kwargs: null
  action_noise: 0.05
  interpolation_steps: 5
  num_fixed_steps: 0
  collect_obs: true
  camera_names: []
  camera_size: null
  render_video: false
  num_source_demos: null
on_config_change: error
