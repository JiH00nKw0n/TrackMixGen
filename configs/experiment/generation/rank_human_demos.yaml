defaults:
  - pool_robosuite_image
  - _self_
# Pool for ranking a task's human (source) demonstrations: 3,000 attempts (300 per source for a task with 10 sources,
# roughly 30 to 100 successes per source at 10 to 30 % generation success) in chunks of 250, chunk seeds from 20001.
# `tmg rank_sources` counts each source's successes in this pool and writes the ranking next to the generator config.
# The Isaac Lab generators read `guarantee: false` (inherited) and run the fixed attempt count too (not 3,000 successes).
name: rank_human_demos
protocol:
  camera_names: []                  # ranking needs no images
  keep_failed: true                 # the 2026-10 values of the ranking pools, kept explicitly (pool_robosuite_image moved to the
  select_src_per_subtask: true      # official selection on 2026-10-29): a source chosen at random for every subtask, so a 3,000-
  selection_strategy: random        # attempt pool samples every source in every subtask about equally (the ranking is per subtask)
  selection_strategy_kwargs: null
attempts: 3000
chunk: 250
seed_offset: 20000
