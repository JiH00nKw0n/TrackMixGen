defaults:
  - pool_robosuite_image
  - _self_
# Full robosuite pool without images (same chunking and seeds as `pool_robosuite_image`): for low-dim datasets only.
# Generation is about 1.6x faster per step without rendering. The source selection rule is the `selection` group
# (official | ours), as for every pool; the 2026-10 exploration pools of this size were made with selection=ours.
name: pool_robosuite_lowdim
protocol:
  camera_names: []
  keep_failed: true
