# TrackMix: logistic source mixing + error-adaptive path following + pre-noise action labels.
name: trackmix
mixing:
  enabled: true
  type: logistic                    # tmg/generation/method/logistic_mix.py: per subtask, predict every source's success in the
                                    # current scene and blend the sources at or above the mean prediction, weighted by it
  coefficients: ${generator.name}/${task.name}   # configs/experiment/generator/<gen>/coefficients/<task>.yaml (tmg fit_coefficients);
                                    # `make generate` builds it from scratch when missing (scripts/ensure_coefficients.sh)
  symmetries: ${oc.select:task.mixing_symmetries,null}   # object symmetries the mixer may align sources with before blending
                                    # (logistic_mix.py step 4; the parallel-gripper 180 deg flip needs no entry)
tracking:
  enabled: true
  type: error_adaptive              # implementation (tmg/generation/method/tracking.py)
  ds_min: 0.25
  regions:
    default: {alpha_p: 12.0, alpha_r: 1.2}
    approach: {alpha_p: 50.0, alpha_r: 5.0}
  approach_window: 10               # waypoints before (and at) a gripper event that use the approach gains
  extra_steps_cap: segment          # extra steps per segment at most the segment length, then base speed
  gripper_events: {type: sign}      # sign: scalar +close/-open commands (robosuite, Soft); closure: many-joint hands (GR1)
labels: pre_noise                   # pre_noise | executed
