# SkillMix: per subtask, blend the source demonstrations with the softmax weights that maximize the task success predicted
# by the fitted mixed-effects logistic model (tmg/generation/method/skillmix.py), executed actions as labels.
name: skillmix
mixing:
  enabled: true
  type: skillmix
  rule: softmax                     # softmax: the SkillMix rule (training pools) | calibration: random Dirichlet weights,
                                    # only for the calibration pools the fit reads; give it its own folder with
                                    # method.name=skillmix_calibration (`make coefficients` does both)
  coefficients: ${generator.name}/${task.name}   # rule file configs/experiment/generator/<gen>/coefficients/<task>.yaml
                                    # (tmg fit_coefficients); `make generate` builds it when missing (scripts/ensure_coefficients.sh)
  symmetries: ${oc.select:task.mixing_symmetries,null}   # object symmetries the mixer may align sources with before blending
                                    # (skillmix.py step 1; the parallel-gripper 180 deg flip needs no entry)
labels: executed
