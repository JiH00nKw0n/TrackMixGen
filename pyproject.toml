[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tmg"
version = "0.1.0"
description = "TrackMixGen: path following and demonstration mixing on top of MimicGen-style synthetic demonstration generators"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "hydra-core>=1.3,<1.4",
    "omegaconf>=2.3,<2.4",
    "numpy>=1.23",
    "h5py>=3.8",
    "pyyaml>=6.0",
    "scipy>=1.10",
    "msgpack>=1.0",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]
train = ["torch>=2.7,<2.12", "torchvision>=0.22", "lerobot[diffusion,pi]==0.6.1", "safetensors>=0.4"]

[project.scripts]
tmg = "tmg.cli:main"

[tool.setuptools.packages.find]
include = ["tmg*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
